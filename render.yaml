services:
  - type: web
    name: podtekst-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: MODE
        value: webhook
      - key: WEBAPP_URL
        value: https://podtekst-mz6thc2z.agent.mira.tg
      - key: STORE_PATH
        value: /data/store.json
      - key: BOT_TOKEN
        sync: false
    disk:
      name: podtekst-data
      mountPath: /data
      sizeGB: 1
