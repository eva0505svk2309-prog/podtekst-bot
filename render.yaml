services:
  - type: web
    name: podtekst-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: MODE
        value: webhook
      - key: WEBHOOK_BASE
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: WEBAPP_URL
        value: https://podtekst-mz6thc2z.agent.mira.tg
