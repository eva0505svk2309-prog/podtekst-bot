<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ПОДТЕКСТ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#120a1e;color:#f4ecff;font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding:12px;display:flex;flex-direction:column;gap:10px;user-select:none}
header{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.logo{font-weight:900;font-size:18px;margin-right:auto;letter-spacing:.5px}
.logo span{background:linear-gradient(90deg,#ff4d8d,#a86bff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.pill{background:#25153f;border:1px solid #4a2f86;border-radius:999px;padding:6px 11px;font-weight:700;font-size:14px}
.card{background:linear-gradient(160deg,#1e1134,#150c26);border:1px solid #3b2a63;border-radius:16px;padding:12px}
.tabs{display:flex;gap:6px;background:#1c1030;padding:5px;border-radius:14px}
.tabs button{flex:1;background:transparent;border:0;color:#a894d4;font-weight:800;font-size:14px;padding:9px 4px;border-radius:11px;cursor:pointer}
.tabs button.on{background:linear-gradient(135deg,#ff4d8d,#a86bff);color:#fff}
button{background:#241546;border:1px solid #4a2f86;color:#f4ecff;border-radius:12px;padding:12px 8px;font-size:15px;font-weight:700;cursor:pointer}
button:active{transform:scale(.97)}
button:disabled{opacity:.45}
button.pri{background:linear-gradient(135deg,#ff4d8d,#a86bff);border-color:transparent;color:#fff}
.row{display:flex;gap:8px;margin-top:10px}
.row>*{flex:1}
.view{display:none}
.view.on{display:block}
#board{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;background:#0e0819;padding:6px;border-radius:14px}
.cell{aspect-ratio:1;border-radius:10px;background:#241546;display:flex;align-items:center;justify-content:center;font-size:clamp(19px,6.6vw,32px)}
.cell.sel{background:#3b2170;transform:scale(1.08)}
.cell.pop{background:#7c3aed}
#q{font-size:18px;font-weight:800;line-height:1.3;margin-bottom:10px}
.opt{width:100%;text-align:left;margin-bottom:8px;font-weight:600}
.opt.ok{background:#14532d;border-color:#22c55e;color:#dcfce7}
.opt.no{background:#4c1d24;border-color:#f43f5e;color:#ffe4e6}
.hint{font-size:13px;color:#a894d4;text-align:center;margin-top:8px}
#bar{height:8px;background:#2b1d4a;border-radius:99px;overflow:hidden;margin:8px 0}
#bar i{display:block;height:100%;background:linear-gradient(90deg,#ff4d8d,#ffb84d);width:0;transition:width .3s}
#panel{text-align:center}
#panel h2{font-size:20px;margin-bottom:6px}
.small{font-size:12px;color:#a894d4;text-align:center}
a{color:#c4b5fd}
</style>
</head>
<body>
<header>
  <div class="logo">ПОД<span>ТЕКСТ</span></div>
  <div class="pill">🪙 <span id="coins">0</span></div>
  <div class="pill">🔥 <span id="streak">0</span></div>
  <div class="pill">💗 <span id="lives">5</span></div>
</header>

<div class="tabs">
  <button data-v="quiz" class="on">🎯 Квиз</button>
  <button data-v="m3">🔷 Три в ряд</button>
  <button data-v="day">🏆 День</button>
</div>

<!-- QUIZ -->
<section class="view on" id="v-quiz">
 <div class="card">
  <div id="q">Загрузка…</div>
  <div id="opts"></div>
  <div class="hint" id="qhint"></div>
 </div>
 <div class="row">
  <button id="qSkip">⏭ Пропустить</button>
  <button id="qNext">➡️ Дальше</button>
 </div>
 <div class="row">
  <button id="qBuy">🪙 Купить монеты</button>
  <button id="qRef">👥 Пригласить</button>
 </div>
</section>

<!-- MATCH3 -->
<section class="view" id="v-m3">
 <div class="card">
  <div style="display:flex;justify-content:space-between;font-size:13px;color:#a894d4">
   <span>Ур. <b id="lvl">1</b></span><span id="goalTxt">цель: 0</span><span>ходов: <b id="moves">20</b></span>
  </div>
  <div id="bar"><i></i></div>
  <div id="board"></div>
  <div class="hint" id="m3hint">Выбери тайл и соседний</div>
 </div>
 <div class="row">
  <button id="mMove">+5 ходов · 50 🪙</button>
  <button id="mShuffle">Перемешать · 30 🪙</button>
  <button id="mLife">+1 жизнь · 200 ⭐</button>
 </div>
 <div class="row">
  <button id="mHint">Подсказка · 20 🪙</button>
  <button id="mReset">Заново</button>
 </div>
</section>

<!-- DAILY -->
<section class="view" id="v-day">
 <div class="card">
  <div id="dTitle" style="font-weight:800;font-size:18px;margin-bottom:6px">Челлендж дня 🏆</div>
  <div id="dText" style="font-size:15px"></div>
  <div id="dBoard" style="margin-top:10px"></div>
 </div>
 <div class="row">
  <button class="pri" id="dStart">▶️ Играть челлендж</button>
  <button id="dShare">📤 Поделиться</button>
 </div>
 <div class="hint" id="dhint">У всех одинаковые задания. Топ-10% получает бонус.</div>
</section>

<div class="small">18+ · <a href="https://t.me/podtekst_game_bot">канал</a> ·
 <span id="ts"></span></div>

<script>
const tg=window.Telegram.WebApp;tg.expand();tg.enableClosingConfirmation();
tg.setHeaderColor('#120a1e');tg.setBackgroundColor('#120a1e');
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const toast=m=>{try{tg.showAlert(m)}catch(e){alert(m)}};

/* ---------- wallet (server-authoritative) ---------- */
const API="https://podtekst-bot-production.up.railway.app";
const INIT=(window.Telegram&&Telegram.WebApp&&Telegram.WebApp.initData)||"";
const S={coins:0,streak:0,lives:5,lvl:1,best:0,noads:false};
let pending=null;
function paint(){try{$("coins").textContent=S.coins;$("streak").textContent=S.streak;
 $("lives").textContent=S.lives;$("lvl").textContent=S.lvl;}catch(e){}}
function save(){paint();}
async function api(action,extra){
 if(!INIT)return null;
 try{
  const r=await fetch(API+"/api/action",{method:"POST",headers:{"Content-Type":"application/json"},
   body:JSON.stringify(Object.assign({init_data:INIT,action:action},extra||{}))});
  const j=await r.json();
  if(j&&typeof j.coins==="number"){S.coins=j.coins;S.lives=j.lives;S.streak=j.streak;S.best=j.best;S.lvl=j.level;S.noads=j.noads;paint();}
  return j;
 }catch(e){return null;}
}
async function syncWallet(){
 if(!INIT)return;
 try{
  const r=await fetch(API+"/api/wallet",{method:"POST",headers:{"Content-Type":"application/json"},
   body:JSON.stringify({init_data:INIT})});
  const j=await r.json();
  if(j&&typeof j.coins==="number"){S.coins=j.coins;S.lives=j.lives;S.streak=j.streak;S.best=j.best;S.lvl=j.level;S.noads=j.noads;paint();}
 }catch(e){}
}
function spendCoins(n,reason){
 if(S.coins<n){toast("Не хватает монет 🪙");return false;}
 S.coins-=n;paint();
 api("spend",{amount:n});
 return true;
}

/* ---------- tabs ---------- */
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));
 b.classList.add('on');
 document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));
 $('v-'+b.dataset.v).classList.add('on');
});

/* ---------- QUIZ (server-authoritative) ---------- */
let qi=-1,qOpts=[],answered=false,timer=null,left=10,curQ=null;

async function loadQuestion(mode){
  if(!INIT){ // без Telegram — локальный запасной вариант
    const Q=[{q:"Он написал «ок» в 23:41. Это значит…",o:["Всё хорошо, спит","Что-то не так, но он не хочет говорить","Он в душе","Просто не заметил"],c:1,h:"23:41 — не время для «ок»."},
             {q:"«Позвони, если что»",o:["Никогда не позвонит","Позвонит, если что случилось","Ждёт звонка прямо сейчас","Он занят"],c:1,h:"Фраза-отказ и фраза-приглашение одновременно."},
             {q:"Не спрашивала — сам прислал фото с отпуска",o:["Ему скучно без тебя","Показать, что там красиво без тебя","Просто делится","Хвастается"],c:0,h:"Пишет первым = ты в мыслях."}];
    const it=Q[Math.floor(Math.random()*Q.length)];
    curQ=it;qi=-1;qOpts=it.o;renderQ();return;
  }
  try{
    const r=await fetch(API+"/api/quiz",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({init_data:INIT,mode:mode||"random"})});
    const j=await r.json();
    if(j&&j.q){curQ=j;qOpts=j.o;qi=j.id;renderQ();}
  }catch(e){toast("Не удалось загрузить вопрос");}
}
function renderQ(){
  answered=false;left=10;$("q").textContent=curQ.q;$("qhint").textContent="";$("opts").innerHTML="";
  qOpts.forEach((t,k)=>{const b=document.createElement("button");b.className="opt";b.textContent=t;
    b.onclick=()=>pick(k,b);$("opts").appendChild(b);});
  clearInterval(timer);$("q").style.opacity=1;
  timer=setInterval(()=>{left-=0.1;if(left<=0){clearInterval(timer);pick(-1,null)}},100);
}
async function pick(k,btn){
  if(answered)return;answered=true;clearInterval(timer);
  if(!INIT){
    const good=k===curQ.c;
    [...$("opts").children].forEach((b,i)=>{if(i===curQ.c)b.classList.add("ok");else if(i===k)b.classList.add("no");else b.disabled=true});
    if(good){S.coins+=10;S.streak++;$("qhint").textContent="✅ Верно! +10 🪙 · серия "+S.streak;}
    else{S.coins=Math.max(0,S.coins-5);S.streak=0;$("qhint").textContent="❌ Правильный: "+curQ.o[curQ.c]+" · −5 🪙"}
    paint();return;
  }
  try{
    const r=await fetch(API+"/api/answer",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({init_data:INIT,id:qi,choice:k})});
    const j=await r.json();
    if(!j||j.error){toast("Ошибка проверки ответа");answered=false;return;}
    [...$("opts").children].forEach((b,i)=>{if(j.correct&&i===k)b.classList.add("ok");else if(!j.correct&&i===k)b.classList.add("no");else b.disabled=true});
    if(j.correct){
      $("qhint").textContent="✅ Верно! +10 🪙 · серия "+j.streak+(j.streak%5===0?" · бонус +25 🪙":"");
    }else{
      $("qhint").textContent="❌ Правильный: "+j.answer+" · −5 🪙"+(j.hint?" · "+j.hint:"");
    }
    if(typeof j.coins==="number"){S.coins=j.coins;S.lives=j.lives;S.streak=j.streak;S.best=j.best;S.lvl=j.level;paint();}
  }catch(e){toast("Нет связи с сервером");}
}
$("qNext").onclick=()=>loadQuestion("random");
$("qSkip").onclick=()=>{if(!answered)pick(-1,null)};
$("qBuy").onclick=()=>{tg.sendData("buy")};
$("qRef").onclick=()=>{tg.sendData("ref")};


/* ---------- MATCH3 ---------- */
const N=8,TYPES=['🍷','🍸','🌶️','💋','🍑','🧿'];
let grid=[],sel=null,score=0,goal=0,moves=0,combo=0,busy=false,rng=Math.random;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
 t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function seeded(){const d=new Date();const k=d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();return mulberry(k)}
function rnd(n){return Math.floor(rng()*n)}
function filled(){const g=[];for(let r=0;r<N;r++){g.push([]);for(let c=0;c<N;c++)g[r].push(-1)}return g}
function findMatches(g){const s=new Set();
 for(let r=0;r<N;r++){let run=1;for(let c=1;c<=N;c++){const same=c<N&&g[r][c]===g[r][c-1]&&g[r][c]!==-1;
  if(same)run++;else{if(run>=3)for(let x=c-run;x<c;x++)s.add(r+','+x);run=1}}}
 for(let c=0;c<N;c++){let run=1;for(let r=1;r<=N;r++){const same=r<N&&g[r][c]===g[r-1][c]&&g[r][c]!==-1;
  if(same)run++;else{if(run>=3)for(let x=r-run;x<r;x++)s.add(x+','+c);run=1}}}
 return s}
function hasMove(g){for(let r=0;r<N;r++)for(let c=0;c<N;c++)for(const[dr,dc]of[[0,1],[1,0]]){
  const r2=r+dr,c2=c+dc;if(r2>=N||c2>=N)continue;const a=g[r][c];g[r][c]=g[r2][c2];g[r2][c2]=a;
  const ok=findMatches(g).size>0;const b=g[r][c];g[r][c]=g[r2][c2];g[r2][c2]=b;if(ok)return true}return false}
function makeBoard(){let g=filled();for(let r=0;r<N;r++)for(let c=0;c<N;c++)g[r][c]=rnd(TYPES.length);
 for(let i=0;i<50;i++){const m=findMatches(g);if(!m.size)break;m.forEach(k=>g[k.r][k.c]=rnd(TYPES.length))}
 let guard=0;while(!hasMove(g)&&guard++<30){g=filled();for(let r=0;r<N;r++)for(let c=0;c<N;c++)g[r][c]=rnd(TYPES.length);
  for(let i=0;i<50;i++){const m=findMatches(g);if(!m.size)break;m.forEach(k=>g[k.r][k.c]=rnd(TYPES.length))}}
 return g}
function render(pop){const bd=$("board");bd.innerHTML="";
 for(let r=0;r<N;r++)for(let c=0;c<N;c++){const d=document.createElement("div");
  d.className="cell"+(pop&&pop.has(r+','+c)?" pop":"")+(sel&&sel.r===r&&sel.c===c?" sel":"");
  d.textContent=grid[r][c]===-1?"":TYPES[grid[r][c]];d.onclick=()=>tap(r,c);bd.appendChild(d)}}
function gravity(){for(let c=0;c<N;c++){let w=N-1;for(let r=N-1;r>=0;r--)if(grid[r][c]!==-1){grid[w][c]=grid[r][c];if(w!==r)grid[r][c]=-1;w--}
 for(let r=w;r>=0;r--)grid[r][c]=rnd(TYPES.length)}}
async function resolve(){while(true){const m=findMatches(grid);if(!m.size)break;combo++;
 const gain=m.size*10*combo;score+=gain;m.forEach(k=>grid[k.r][k.c]=-1);render(m);await sleep(220);
 gravity();render();await sleep(150)}combo=0;if(!hasMove(grid))grid=makeBoard();upd()}
function upd(){$("moves").textContent=moves;$("goalTxt").textContent="цель: "+goal;
 $("bar").firstElementChild.style.width=Math.min(100,goal?score/goal*100:0)+"%"}
async function tap(r,c){if(busy)return;if(!sel){sel={r,c};render();return}
 if(sel.r===r&&sel.c===c){sel=null;render();return}
 const dr=Math.abs(sel.r-r),dc=Math.abs(sel.c-c);
 if(dr+dc!==1){sel={r,c};render();return}
 busy=true;const a=sel;sel=null;[grid[a.r][a.c],grid[r][c]]=[grid[r][c],grid[a.r][a.c]];
 if(!findMatches(grid).size){[grid[a.r][a.c],grid[r][c]]=[grid[r][c],grid[a.r][a.c]];
  $("m3hint").textContent="Так не выйдет 🙃";busy=false;render();return}
 moves--;upd();await resolve();busy=false;
 if(score>=goal){const left=moves,stars=left>=10?3:left>=5?2:1;S.coins+=30+stars*20;S.lvl++;save();
  $("m3hint").textContent="Уровень пройден! ⭐".repeat(stars)+" +"+(30+stars*20)+" 🪙";upd();return}
 if(moves<=0){$("m3hint").textContent="Ходы кончились. +5 ходов за рекламу или за 50 🪙";}}
function startLevel(){if(S.lives<=0){$("m3hint").textContent="Жизни кончились — посмотри рекламу в боте";return}
 S.lives--;save();score=0;goal=Math.round(400*Math.pow(1.32,S.lvl-1));moves=20;combo=0;sel=null;
 rng=Math.random;grid=makeBoard();upd();render()}
$("mMove").onclick=()=>{if(!spendCoins(50))return;moves+=5;save();upd()};
$("mShuffle").onclick=()=>{if(!spendCoins(30))return;grid=makeBoard();save();render()};
$("mHint").onclick=()=>{if(!spendCoins(20))return;save();
 for(let r=0;r<N;r++)for(let c=0;c<N;c++)for(const[dr,dc]of[[0,1],[1,0]]){const r2=r+dr,c2=c+dc;
  if(r2>=N||c2>=N)continue;const a=grid[r][c];grid[r][c]=grid[r2][c2];grid[r2][c2]=a;
  const ok=findMatches(grid).size>0;const b=grid[r][c];grid[r][c]=grid[r2][c2];grid[r2][c2]=b;
  if(ok){$("m3hint").textContent="Попробуй обменять эти два";return}}
 $("m3hint").textContent="Ходов нет — перемешаю";grid=makeBoard();render()};
$("mLife").onclick=()=>{tg.sendData("buy:lives")};
$("mReset").onclick=()=>{startLevel()};

/* ---------- DAILY ---------- */
function dailyIdx(){const d=new Date();const k=d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
 return mulberry(k)}
function drawDaily(){const r=dailyIdx();const w=$("dBoard");w.innerHTML="";
 const g=rngPick();g.forEach(t=>{const c=document.createElement("div");c.className="cell";c.textContent=t;w.appendChild(c)});
 $("dTitle").textContent="Челлендж дня 🏆";$("dText").textContent="Собери "+TYPES[r%TYPES.length]+" в ряд 3 раза. Одинаковая доска у всех."}
function rngPick(){const r=dailyIdx();const out=[];for(let i=0;i<8;i++)out.push(TYPES[Math.floor(r()*TYPES.length)]);return out}
$("dStart").onclick=()=>{rng=seeded();score=0;goal=1200;moves=18;combo=0;sel=null;grid=makeBoard();upd();render();
 $("m3hint").textContent="Челлендж дня 🏆 — одинаковые задания у всех";document.querySelector('.tabs button[data-v=m3]').click()};
$("dShare").onclick=()=>{tg.sendData("score:"+S.streak);toast("Скопируй результат и выложи в канал — получишь +20 🪙")};

/* ---------- boot ---------- */
save();syncWallet();loadQuestion("random");drawDaily();
$("ts").textContent="v1.0";
</script>
</body>
</html>
